name: film-app-backend

services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - film-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      PACK_COVER_DIR: "/app/media/pack-covers"
      POISKKINO_API_KEY: ${POISKKINO_API_KEY:-}
      CATALOG_ADMIN_KEY: ${CATALOG_ADMIN_KEY:-}
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      DB_URL: "jdbc:postgresql://db:5432/${DB_NAME:?DB_NAME is required}?connectTimeout=5"
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-1}

    ports:
      - "8081:8080"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./media/pack-covers:/app/media/pack-covers:ro

    stop_grace_period: 15s

  swagger:
    image: swaggerapi/swagger-ui:v5.17.14
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      URL: /openapi.json
      VALIDATOR_URL: none
    volumes:
      - ./docs/api/services:/usr/share/nginx/html/services:ro
      - ./docs/api/openapi.json:/usr/share/nginx/html/openapi.json:ro
      - ./deploy/swagger/swagger-proxy.conf:/etc/nginx/conf.d/film-proxy.conf:ro

volumes:
  film-postgres-data: